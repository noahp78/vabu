name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vabu-packages
          path: dist/release/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vabu-packages
          path: dist/release
      # Attach the same run's artifacts as data; never execute them with a write token.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          cd dist/release
          chrome=(vabu-chrome-*.zip)
          [[ ${#chrome[@]} == 1 ]] || { echo 'Expected one Chrome archive' >&2; exit 1; }
          version=${chrome[0]#vabu-chrome-}
          version=${version%.zip}
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          assets=("${chrome[0]}" "vabu-firefox-$version.zip" "noahp78-vabu-$version.tgz" install.sh)
          for asset in "${assets[@]}"; do
            [[ -f $asset && ! -L $asset ]] || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            preview="preview-$GITHUB_SHA"
            if gh release view "$preview" >/dev/null 2>&1; then
              exit 0
            fi
            gh release create "$preview" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "Preview ${GITHUB_SHA:0:12}" --prerelease --latest=false --generate-notes
          else
            [[ $TAG == "v$version" ]] || { echo 'Tag must match package version' >&2; exit 1; }
            status=$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" --jq .status)
            [[ $status == identical || $status == ahead ]] || { echo 'Release commit must be on main' >&2; exit 1; }
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft --generate-notes
          fi
