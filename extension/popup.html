<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>VACU</title>
<style>
  body { width: 320px; padding: 12px; font: menu; color-scheme: light dark; }
  h1 { margin: 0 0 8px; font-size: 1.25rem; }
  h2 { font-size: 1rem; }
  #approval-target { overflow-wrap: anywhere; }
</style>
<h1>VACU</h1>
<section id="approval" aria-labelledby="approval-heading" hidden>
  <h2 id="approval-heading">Vacu wants to control this tab</h2>
  <p id="approval-target"></p>
  <p>Allow control of this document only. The requester must retry within 60 seconds of the request.</p>
  <button id="deny" type="button">Deny</button>
  <button id="allow" type="button">Allow</button>
</section>
<p id="approval-status" role="status"></p>
<p id="status" role="status">Starting…</p>
<button id="bridge" type="button" disabled>Start local bridge</button>
<button id="feedback" type="button">Leave page feedback</button>
<p id="feedback-status" role="status"></p>
<p>Browser site access still applies. Tabs not opened by this bridge require your approval before VACU can control them.</p>
<script type="module" src="popup.js"></script>
